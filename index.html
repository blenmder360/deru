<style>
/* layout: one fixed 3:2 pixel-art stage centered on a black letterbox; text sits on the stage */
:root{
  --void:#0b0907;
  --paper:#efe3c8;
  --ember:#e2a05a;
  --dim:#8a7a62;
  --font-dot:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--void);color:var(--paper);font-family:var(--font-dot);
  margin:0;overflow:hidden;
  padding-left:max(0px, env(safe-area-inset-left, 0px));
  padding-right:max(0px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
#app{height:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage{
  position:relative;
  width:min(100vw, 150vh);width:min(100vw, 150dvh);
  aspect-ratio:3/2;max-width:100%;
  overflow:hidden;background:var(--void);
}
.stage img{
  position:absolute;inset:0;width:100%;height:100%;
  image-rendering:pixelated;image-rendering:crisp-edges;
}
.cut{opacity:0;transform:scale(1);transform-origin:50% 50%}
.cut.on{opacity:1}
.stage img.panel{inset:auto;left:25%;top:0;width:50%;height:100%}
.cut.push{transition:transform 3.4s linear;transform:scale(1.05)}
#genkan{transform-origin:62% 52%}
#genkan.push{transition:transform 4.5s ease-in;transform:scale(1.14)}
#back{position:absolute;inset:0}
#shade{position:absolute;inset:0;opacity:0;transition:opacity 3.2s ease-in;
  -webkit-mask-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAACgCAYAAAAy2+FlAAACt0lEQVR4Xu3d0W7iMBRFUTrq//9yR3lAQqgFxzHxPfFajyNITIfNddOovd0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIC9vvY+gUN+Xjz7/n9x9DGbUccadZzHNb3z6vW3WOo9/a/lKwLUJGAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJuBr+LrGy2Cv771PoJyWeJ8f81PuVdDFBL6O30Le/q0lcEIJeD2m74XYQl/Lu2kr3osRcH1/bY17Yhx5LAoQcK5303YPF7lCCbi++6QdGew7Z56LAwRMNT48dnAVur5ZPwrq+R6bk5nAdc2eRLPPTwMTuJ5ZE/dMpvsgAqbF6Gk8+njLEnANCW/ohDUuR8A1pGwpV9jeR3ERiz3O+qDpPc9yuwQTmGp6490ceW4kAUMwAbPHclvU6gTMXiIuRMA1iIIuAp4vMd7ENV+SgOkl4gIEPJcIOETAEMydWHPN+G0bIyx3w0RVJjA9bP2LEDAEE/B8phndBAzBBAzBBEwPV6GLEDAEE3ANJhpdBDxfSrzbOlPWugwB11QplOe7xSqtbXkChmACrsuk4y0B08oHSkECrqnK7ZVbtFXWwi8EXE/FSVdxTdxuAi6swuSrsAZeMIFrMvFoIuC6nm+cOCPqx3OccT4OEnB9Z0V11nkYSMAZ7leDt+9JPzEZH++2+sTx+RAB53i+pXGk+9/9FW8Yv5WSjXBDCTjTY3BHf9Qj3mC20OdqiW3UY1hAy5sFznR0R7DUe9oEhmAChmACBgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGOI/ntY5z0VRvv4AAAAASUVORK5CYII=);mask-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAACgCAYAAAAy2+FlAAACt0lEQVR4Xu3d0W7iMBRFUTrq//9yR3lAQqgFxzHxPfFajyNITIfNddOovd0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIC9vvY+gUN+Xjz7/n9x9DGbUccadZzHNb3z6vW3WOo9/a/lKwLUJGAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJmAIJuBr+LrGy2Cv771PoJyWeJ8f81PuVdDFBL6O30Le/q0lcEIJeD2m74XYQl/Lu2kr3osRcH1/bY17Yhx5LAoQcK5303YPF7lCCbi++6QdGew7Z56LAwRMNT48dnAVur5ZPwrq+R6bk5nAdc2eRLPPTwMTuJ5ZE/dMpvsgAqbF6Gk8+njLEnANCW/ohDUuR8A1pGwpV9jeR3ERiz3O+qDpPc9yuwQTmGp6490ceW4kAUMwAbPHclvU6gTMXiIuRMA1iIIuAp4vMd7ENV+SgOkl4gIEPJcIOETAEMydWHPN+G0bIyx3w0RVJjA9bP2LEDAEE/B8phndBAzBBAzBBEwPV6GLEDAEE3ANJhpdBDxfSrzbOlPWugwB11QplOe7xSqtbXkChmACrsuk4y0B08oHSkECrqnK7ZVbtFXWwi8EXE/FSVdxTdxuAi6swuSrsAZeMIFrMvFoIuC6nm+cOCPqx3OccT4OEnB9Z0V11nkYSMAZ7leDt+9JPzEZH++2+sTx+RAB53i+pXGk+9/9FW8Yv5WSjXBDCTjTY3BHf9Qj3mC20OdqiW3UY1hAy5sFznR0R7DUe9oEhmAChmACBgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAGOI/ntY5z0VRvv4AAAAASUVORK5CYII=);
  -webkit-mask-size:100% 100%;mask-size:100% 100%}
#shade.on{opacity:1}
#shade img{animation:sway 5.5s steps(10) infinite alternate}
@keyframes sway{0%{transform:translate(-0.6%,0)}100%{transform:translate(0.5%,0.4%)}}
#back.push{transition:transform 9s linear;transform:scale(1.07)}
#blink{position:absolute;inset:0;background:var(--void);opacity:0;pointer-events:none;transition:opacity .35s}
#blink.on{opacity:1}
.stage.shake{animation:shake .28s steps(4) 1}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-0.6%,0.3%)}
  50%{transform:translate(0.5%,-0.3%)}75%{transform:translate(-0.3%,0.2%)}100%{transform:translate(0,0)}
}
#fade{position:absolute;inset:0;background:var(--void);opacity:1;transition:opacity 2.4s ease}
.stage.lit #fade{opacity:0}
.stage.out #fade{opacity:1;transition:opacity 1.6s ease}

#chime{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font-size:clamp(20px,6.2vw,46px);letter-spacing:.12em;color:var(--paper);
  text-shadow:0 0 0 var(--void),2px 2px 0 var(--void),-2px 2px 0 var(--void),2px -2px 0 var(--void),-2px -2px 0 var(--void);
  opacity:0;white-space:nowrap;pointer-events:none;
}
#chime.show{animation:chime 1.9s steps(12) forwards}
@keyframes chime{
  0%{opacity:0;transform:translate(-50%,-40%)}
  8%{opacity:1;transform:translate(-50%,-50%)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-56%)}
}
.caption{
  position:absolute;left:0;right:0;bottom:6%;text-align:center;
  font-size:clamp(12px,3.4vw,20px);color:var(--paper);letter-spacing:.1em;
  text-shadow:1px 1px 0 var(--void),-1px 1px 0 var(--void),1px -1px 0 var(--void),-1px -1px 0 var(--void);
  opacity:0;transition:opacity .8s;pointer-events:none;
}
.caption.show{opacity:1;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

#title{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em;
  background:var(--void);text-align:center;padding:0 16px;transition:opacity .6s;
}
#title h1{margin:0;font-weight:400;font-size:clamp(24px,7vw,52px);letter-spacing:.18em;color:var(--paper);text-wrap:balance}
#title .start{font-size:clamp(13px,3.6vw,20px);color:var(--ember);letter-spacing:.14em;animation:blink 1.6s steps(2) infinite}
#title .note{font-size:clamp(10px,2.6vw,13px);color:var(--dim);letter-spacing:.06em;line-height:1.8}
#title.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .stage.shake{animation:none}
  .caption.show,#title .start{animation:none}
  .cut.push,#genkan.push,#back.push{transition:none;transform:scale(1)}
  #shade img{animation:none}
}

/* ---- title, game, endings ---- */
:root{--glass:#cfa38b;--blood:#b4433a;--font-title:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
#titleScreen{position:fixed;inset:0;z-index:20;background:var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px));
  cursor:pointer;transition:opacity .8s}
#titleScreen.gone{opacity:0;pointer-events:none}
.twrap{position:relative;flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#tglass,#glass{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.twrap h1{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);margin:0;writing-mode:vertical-rl;
  font-family:var(--font-title);font-weight:800;font-size:clamp(64px,20vw,132px);letter-spacing:.06em;line-height:1;color:var(--paper);
  text-shadow:0 0 22px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)}
#titleScreen .start{font-size:clamp(14px,3.8vw,18px);color:var(--ember);letter-spacing:.16em;animation:blink 1.6s steps(2) infinite}
#titleScreen .note{font-size:11px;color:var(--dim);letter-spacing:.06em;text-align:center}
.skip{position:fixed;z-index:15;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  font-family:var(--font-dot);font-size:13px;letter-spacing:.08em;color:var(--dim);background:var(--void);border:1px solid currentColor;padding:8px 12px;cursor:pointer}
.skip:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#drop{position:fixed;inset:0;z-index:30;background:var(--void);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
#drop.on{opacity:1}
#drop span{writing-mode:vertical-rl;font-family:var(--font-title);font-weight:800;font-size:clamp(84px,28vw,190px);letter-spacing:.06em;color:var(--paper);opacity:0}
#drop.on span{animation:dropin 3.2s ease forwards}
@keyframes dropin{0%{filter:blur(14px);opacity:0;transform:scale(1.1)}35%{filter:blur(0);opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}
body.mode-game #app{display:none}
#game{position:fixed;inset:0;z-index:10;background:var(--void);display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
#game > *{width:100%;max-width:440px}
.hud{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.say{min-height:3.9em;border:2px solid var(--paper);padding:8px 12px;font-size:15px;line-height:1.6}
.say p{margin:0}
#glassWrap{position:relative;flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
#game.enter #glass{animation:grow .9s steps(9) both}
@keyframes grow{from{transform:scale(.42);opacity:.2}to{transform:scale(1);opacity:1}}
#timer{position:absolute;left:0;right:0;top:0;height:5px;background:rgba(239,227,200,.12)}
#timer i{display:block;height:100%;width:100%;background:var(--blood)}
.prompt{text-align:center;font-family:var(--font-title);font-weight:800;font-size:17px;letter-spacing:.4em;color:var(--dim);margin-block:-2px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qs .b:last-child{grid-column:span 2}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{font-family:var(--font-dot);font-size:13px;color:var(--paper);background:transparent;border:2px solid var(--paper);border-radius:0;padding:8px 6px;min-height:40px;cursor:pointer;touch-action:manipulation}
.b:active{background:var(--paper);color:var(--void)}
.b:disabled{opacity:.28;cursor:default}
.b:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.decide .b{font-size:18px;min-height:52px;letter-spacing:.3em}
#btnOpen{border-color:var(--ember);color:var(--ember)}
#btnOpen:active{background:var(--ember);color:var(--void)}
#over{position:fixed;inset:0;z-index:40;background:var(--void);display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.beast{position:absolute;left:50%;bottom:-25vh;width:95vmax;height:140vmax;transform:translateX(-50%) scale(.3);filter:blur(18px);opacity:0;pointer-events:none}
.beast::before{content:"";position:absolute;left:50%;top:0;width:32%;height:24%;transform:translateX(-50%);border-radius:50%;background:#050307}
.beast::after{content:"";position:absolute;left:4%;right:4%;top:21%;bottom:0;border-radius:42% 42% 0 0;background:#050307}
#over.go{animation:glassflash 1.4s ease forwards}
@keyframes glassflash{0%{background:var(--glass)}100%{background:var(--void)}}
#over.go .beast{animation:beast 1.25s cubic-bezier(.55,0,.9,.4) forwards}
@keyframes beast{0%{opacity:0;transform:translateX(-50%) scale(.3)}15%{opacity:1}100%{opacity:1;transform:translateX(-50%) scale(1.6)}}
.endbox{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;opacity:0;animation:fadein .9s ease forwards}
#over.go .endbox{animation-delay:1.3s}
#over.bad .endbox{animation-delay:.2s}
@keyframes fadein{to{opacity:1}}
.endbox h2{margin:0;font-family:var(--font-title);font-weight:800;font-size:clamp(28px,8vw,40px);letter-spacing:.12em;text-wrap:balance}
#over.go h2,#over.bad h2{color:var(--blood)}
#endBody{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.7;width:100%}
#endBody p{margin:0;text-wrap:pretty}
#endBody .tell{color:var(--dim);font-size:13px}
.log{list-style:none;margin:6px 0 0;padding:0;width:100%;display:flex;flex-direction:column;gap:4px;font-size:14px}
.log li{display:flex;justify-content:space-between;border-bottom:1px solid rgba(239,227,200,.15);padding:4px 2px}
.log b{font-weight:400;color:var(--ember)}
#endScore{margin:0;font-size:20px;letter-spacing:.12em;color:var(--ember);font-variant-numeric:tabular-nums}
#endScore:empty{display:none}
.endbtns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){
  #game.enter #glass,#over.go .beast,#drop.on span{animation-duration:.01s}
}
.pxtitle{display:block;image-rendering:pixelated;image-rendering:crisp-edges;height:min(52vh,560px);width:auto;max-width:none}
#drop .pxtitle{height:min(62vh,640px)}
.twrap h1{writing-mode:horizontal-tb!important;font-size:0!important;text-shadow:none!important}
.twrap h1 .pxtitle{filter:drop-shadow(0 0 14px rgba(0,0,0,.8));height:min(42vh,460px)}
.prompt,.endbox h2{font-family:var(--font-dot)!important;font-weight:400!important}
#mcv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;image-rendering:crisp-edges;opacity:0;transition:opacity .35s}
#over.go #mcv{opacity:1}
#over.go.end #mcv{opacity:0}
#over.go{animation:none!important;background:var(--void)}
#over.go .endbox{animation:none;opacity:0}
#over.go.end .endbox{animation:fadein .9s ease .3s forwards}
#over.shake #mcv{animation:shake .28s steps(4) 1}
</style>

<script>
(function(){
  const stage=document.getElementById('stage');
  const title=document.getElementById('titleScreen');
  const chimeEl=document.getElementById('chime');
  const cap=document.getElementById('cap');
  let ac=null, master=null, cicadaBus=null;
  let state='title'; // title -> playing -> waiting
  let timers=[];

  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function clearTimers(){timers.forEach(clearTimeout);timers=[]}

  function makeNoise(seconds){
    const len=ac.sampleRate*seconds, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    return buf;
  }

  // ---- cicadas: far broadband chorus + an evening "kana-kana" voice ----
  // ---- summer cicadas ----
  // Pulse-train buffers: a cicada's song is thousands of tiny clicks per second,
  // so we build the click trains sample by sample and shape them with filters.
  function pulseBuffer(seconds, rate, jitter, clickMs){
    const sr=ac.sampleRate, len=Math.floor(sr*seconds);
    const buf=ac.createBuffer(1,len,sr), d=buf.getChannelData(0);
    const clickLen=Math.max(8,Math.floor(sr*clickMs/1000));
    let i=0;
    while(i<len){
      const amp=0.6+Math.random()*0.4;
      for(let k=0;k<clickLen&&i+k<len;k++){
        const env=Math.exp(-k/(clickLen*0.28));
        d[i+k]+=(Math.random()*2-1)*env*amp;
      }
      i+=Math.floor(sr/(rate*(1+(Math.random()*2-1)*jitter)));
    }
    // fade the loop seam
    const f=Math.floor(sr*0.03);
    for(let k=0;k<f;k++){const g=k/f;d[k]*=g;d[len-1-k]*=g}
    return buf;
  }
  function makeReverb(){
    const sr=ac.sampleRate, len=Math.floor(sr*2.2);
    const ir=ac.createBuffer(2,len,sr);
    for(let c=0;c<2;c++){
      const d=ir.getChannelData(c); let lp=0;
      for(let i=0;i<len;i++){
        const t=i/len; lp=lp*0.6+(Math.random()*2-1)*0.4;
        d[i]=lp*Math.pow(1-t,3.2)*(i<sr*0.012?0:1);
      }
    }
    const cv=ac.createConvolver(); cv.buffer=ir; return cv;
  }
  function voiceChain(pan, dist){
    // dist 0 = near the window, 1 = far across the street
    const g=ac.createGain(); g.gain.value=0;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000-dist*4500;
    const dry=ac.createGain(); dry.gain.value=1-dist*0.55;
    const wet=ac.createGain(); wet.gain.value=0.25+dist*0.5;
    g.connect(lp);
    let out=lp;
    if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;lp.connect(p);out=p}
    out.connect(dry); out.connect(wet);
    dry.connect(cicadaBus); wet.connect(reverbIn);
    return g;
  }
  let reverbIn=null;
  function startCicadas(){
    minBuf=null;
    cicadaBus=ac.createGain(); cicadaBus.gain.value=0;
    // a touch of "through the window" dulling on everything
    const room=ac.createBiquadFilter(); room.type='highshelf'; room.frequency.value=7500; room.gain.value=-6;
    cicadaBus.connect(room); room.connect(master);
    const rv=makeReverb(); reverbIn=ac.createGain(); reverbIn.gain.value=0.55;
    reverbIn.connect(rv); rv.connect(cicadaBus);
    cicadaBus.gain.linearRampToValueAtTime(1.0, ac.currentTime+3);

    // アブラゼミ: "jiiiiii", a sizzling like frying oil. Several, at different distances.
    const abura=pulseBuffer(6.3,120,0.18,2.6);
    [[-0.7,0.25,0.55],[0.55,0.55,0.45],[0.1,0.85,0.5],[-0.2,0.95,0.4]].forEach(([pan,dist,vol],n)=>{
      const src=ac.createBufferSource(); src.buffer=abura; src.loop=true;
      src.loopStart=Math.random()*2; src.playbackRate.value=0.94+Math.random()*0.12;
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3500+Math.random()*700; bp.Q.value=1.8;
      const pk=ac.createBiquadFilter(); pk.type='lowpass'; pk.frequency.value=6000; pk.Q.value=0.7;
      const v=voiceChain(pan,dist);
      src.connect(bp); bp.connect(pk); pk.connect(v);
      src.start(ac.currentTime, Math.random()*5);
      aburaLife(v.gain, vol, n===0);
    });

  }
  // each abura sings for a long stretch, wavers, stops, then starts again
  function aburaLife(gain, vol, startOn){
    let t=ac.currentTime+(startOn?0.1:Math.random()*6);
    const end=t+600;
    while(t<end){
      const song=12+Math.random()*25, rest=3+Math.random()*10;
      gain.setValueAtTime(0,t);
      gain.linearRampToValueAtTime(vol*0.6,t+0.8);
      gain.linearRampToValueAtTime(vol,t+2.5);
      for(let s=t+3;s<t+song-2;s+=1.2+Math.random()*1.5)gain.linearRampToValueAtTime(vol*(0.75+Math.random()*0.25),s);
      gain.linearRampToValueAtTime(vol*0.5,t+song-0.6);
      gain.linearRampToValueAtTime(0,t+song);
      t+=song+rest;
    }
  }

  // ミンミンゼミ: "miiiin min min min min... miiii"
  let minBuf=null;
  function minSyllable(t, dur, f0, f1, vol, chain){
    const src=ac.createBufferSource(); src.buffer=minBuf; src.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=7;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.linearRampToValueAtTime(f1,t+dur*0.7);
    const bp2=ac.createBiquadFilter(); bp2.type='bandpass'; bp2.Q.value=5;
    bp2.frequency.setValueAtTime(f0*2,t); bp2.frequency.linearRampToValueAtTime(f1*2,t+dur*0.7);
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+Math.min(0.06,dur*0.3));
    g.gain.setValueAtTime(vol,t+dur*0.65);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    const h=ac.createGain(); h.gain.value=0.35;
    src.connect(bp); bp.connect(g); src.connect(bp2); bp2.connect(h); h.connect(g);
    g.connect(chain);
    src.start(t,Math.random()*1.5); src.stop(t+dur+0.05);
  }
  function minminPhrase(t0, pan, dist){
    const chain=voiceChain(pan,dist); chain.gain.value=1;
    const vol=1.9*(1-dist*0.4);
    let t=t0;
    // slow opening "mi...iiin"
    minSyllable(t,1.6,2500,3300,vol*0.8,chain); t+=1.75;
    const n=6+Math.floor(Math.random()*6);
    for(let k=0;k<n;k++){
      const d=0.24+Math.random()*0.04;
      minSyllable(t,d,2900,3450,vol,chain); t+=d+0.06;
    }
    // trailing "miiii..."
    minSyllable(t,2.2,3300,2700,vol*0.7,chain); t+=2.3;
    return t;
  }
  function scheduleMinmin(t){
    if(!cicadaBus)return;
    if(!minBuf)minBuf=pulseBuffer(2,210,0.05,1.8);
    const near=Math.random()<0.5;
    const end=minminPhrase(t, near?-0.45:0.65, near?0.2:0.6);
    const wait=(end+4+Math.random()*7-ac.currentTime)*1000;
    later(()=>scheduleMinmin(ac.currentTime+0.05), Math.max(200,wait));
  }

  // ヒグラシ: "kana-kana-kana", a ringing tone that falls away at dusk
  function kanakana(t0, pan){
    const chain=voiceChain(pan,0.7); chain.gain.value=1;
    const n=12+Math.floor(Math.random()*8);
    let t=t0, f=4650+Math.random()*250;
    for(let k=0;k<n;k++){
      const peak=0.5*Math.max(0.12,1-k/n);
      const o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*1.03,t); o.frequency.exponentialRampToValueAtTime(f,t+0.05);
      const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=f*2.02;
      const am=ac.createOscillator(); am.type='square'; am.frequency.value=95;
      const amG=ac.createGain(); amG.gain.value=0.45;
      const g=ac.createGain(); g.gain.value=0;
      am.connect(amG); amG.connect(g.gain);
      const g2=ac.createGain(); g2.gain.value=0.15; o2.connect(g2); g2.connect(g);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(peak,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.connect(g); g.connect(chain);
      [o,o2,am].forEach(x=>{x.start(t);x.stop(t+0.24)});
      t+=0.16+k*0.004; f-=38;
    }
    return t;
  }
  function scheduleKanakana(t){
    if(!cicadaBus)return;
    const end=kanakana(t, Math.random()<0.5?-0.8:0.8);
    const wait=(end+7+Math.random()*9-ac.currentTime)*1000;
    later(()=>scheduleKanakana(ac.currentTime+0.05), Math.max(200,wait));
  }

  // ---- doorbell: "pin" then "pon" ----
  function ding(t,f,dur,vol){
    [[1,1],[2.01,0.28],[3.0,0.08]].forEach(([m,a])=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*m;
      const g=ac.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(vol*a,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
    });
  }
  function playChime(){
    const t=ac.currentTime+0.02;
    ding(t,659.3,0.9,0.42);
    ding(t+0.62,523.3,2.4,0.42);
    // the house goes quiet for a moment
    if(cicadaBus){
      cicadaBus.gain.cancelScheduledValues(t);
      cicadaBus.gain.setValueAtTime(cicadaBus.gain.value,t);
      cicadaBus.gain.linearRampToValueAtTime(0.35,t+0.5);
      cicadaBus.gain.linearRampToValueAtTime(0.75,t+6);
    }
  }

  const blinkEl=document.getElementById('blink');
  const cuts=[...document.querySelectorAll('.cut')];
  function show(id){
    cuts.forEach(c=>{c.classList.toggle('on',c.id===id);c.classList.remove('push')});
    const el=document.getElementById(id);
    if(el.classList.contains('wide'))requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('push')));
  }
  function cutTo(id){
    blinkEl.classList.add('on');
    later(()=>{show(id);blinkEl.classList.remove('on')},380);
  }
  function chimeText(txt){
    chimeEl.textContent=txt;
    chimeEl.classList.remove('show'); void chimeEl.offsetWidth; chimeEl.classList.add('show');
  }
  // footsteps on old wooden floor
  function step(t,vol){
    const src=ac.createBufferSource(); src.buffer=makeNoise(0.3);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    src.connect(lp); lp.connect(g); g.connect(master); src.start(t); src.stop(t+0.3);
    if(Math.random()<0.45){ // creak
      const o=ac.createOscillator(); o.type='sawtooth';
      const f0=180+Math.random()*120; o.frequency.setValueAtTime(f0,t+0.03);
      o.frequency.linearRampToValueAtTime(f0*1.35,t+0.32);
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=6;
      const cg=ac.createGain(); cg.gain.setValueAtTime(0,t+0.03);
      cg.gain.linearRampToValueAtTime(vol*0.18,t+0.1); cg.gain.exponentialRampToValueAtTime(0.001,t+0.36);
      o.connect(bp); bp.connect(cg); cg.connect(master); o.start(t+0.03); o.stop(t+0.4);
    }
  }
  function footsteps(n,gap,vol){
    if(!ac)return; let t=ac.currentTime+0.05;
    for(let i=0;i<n;i++){step(t,vol*(0.85+Math.random()*0.3));t+=gap+(Math.random()*0.08-0.04)}
  }

  function knock(){
    if(!ac)return; let t=ac.currentTime+0.05;
    for(let i=0;i<3;i++){
      const src=ac.createBufferSource(); src.buffer=makeNoise(0.2);
      const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=320; bp.Q.value=2.5;
      const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1.1,t+0.005); g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+0.2);
      // glass rattle
      const s2=ac.createBufferSource(); s2.buffer=makeNoise(0.2);
      const hp=ac.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=2600; hp.Q.value=8;
      const g2=ac.createGain(); g2.gain.setValueAtTime(0,t); g2.gain.linearRampToValueAtTime(0.25,t+0.004); g2.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      s2.connect(hp); hp.connect(g2); g2.connect(master); s2.start(t); s2.stop(t+0.2);
      t+=0.42;
    }
  }
  function sigh(){
    if(!ac)return; const t=ac.currentTime+0.05;
    const src=ac.createBufferSource(); src.buffer=makeNoise(1.4);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(900,t); bp.frequency.linearRampToValueAtTime(500,t+1.1); bp.Q.value=0.8;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.32,t+0.15); g.gain.linearRampToValueAtTime(0.18,t+0.6); g.gain.exponentialRampToValueAtTime(0.001,t+1.2);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+1.4);
  }
  // the shadow surfacing: a low swell and a ringing in the ears, cut off by a heartbeat
  function revealSfx(){
    if(!ac)return; const t=ac.currentTime+0.05, peak=t+3.3;
    const bus=ac.createGain(); bus.gain.value=1; bus.connect(master);
    // low drone, two detuned tones
    [55,58.3,82.4].forEach((f,i)=>{
      const o=ac.createOscillator(); o.type=i===2?'triangle':'sine'; o.frequency.value=f;
      const g=ac.createGain(); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(i===2?0.08:0.22,peak);
      g.gain.setValueAtTime(i===2?0.08:0.22,peak+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,peak+1.6);
      o.connect(g); g.connect(bus); o.start(t); o.stop(peak+1.8);
    });
    // rising breath of air
    const src=ac.createBufferSource(); src.buffer=makeNoise(4);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=4;
    lp.frequency.setValueAtTime(180,t); lp.frequency.exponentialRampToValueAtTime(1400,peak);
    const ng=ac.createGain(); ng.gain.setValueAtTime(0,t); ng.gain.linearRampToValueAtTime(0.16,peak);
    ng.gain.setValueAtTime(0.16,peak); ng.gain.linearRampToValueAtTime(0,peak+0.06);
    src.connect(lp); lp.connect(ng); ng.connect(bus); src.start(t); src.stop(peak+0.2);
    // ringing in the ears
    const o=ac.createOscillator(); o.type='sine'; o.frequency.value=3950;
    const og=ac.createGain(); og.gain.setValueAtTime(0,t+0.6); og.gain.linearRampToValueAtTime(0.022,peak);
    og.gain.setValueAtTime(0.022,peak); og.gain.linearRampToValueAtTime(0,peak+0.05);
    o.connect(og); og.connect(bus); o.start(t+0.6); o.stop(peak+0.1);
    // heartbeat: lub-dub
    [[peak,1],[peak+0.28,0.7]].forEach(([bt,v])=>{
      const b=ac.createOscillator(); b.type='sine';
      b.frequency.setValueAtTime(75,bt); b.frequency.exponentialRampToValueAtTime(38,bt+0.18);
      const bg=ac.createGain(); bg.gain.setValueAtTime(0,bt); bg.gain.linearRampToValueAtTime(0.9*v,bt+0.012);
      bg.gain.exponentialRampToValueAtTime(0.001,bt+0.32);
      b.connect(bg); bg.connect(bus); b.start(bt); b.stop(bt+0.35);
    });
  }
  function silence(sec){
    if(!cicadaBus)return; const t=ac.currentTime;
    cicadaBus.gain.cancelScheduledValues(t); cicadaBus.gain.setValueAtTime(cicadaBus.gain.value,t);
    cicadaBus.gain.linearRampToValueAtTime(0,t+sec);
  }
  function start(){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0.8; master.connect(ac.destination);
      if(ac.state==='suspended')ac.resume();
      startCicadas();
    }catch(e){ac=null}
    title.classList.add('gone'); stopTitleLoop(); el('skip').hidden=false;
    stage.classList.remove('out');
    document.getElementById('shade').classList.remove('on');
    show('read');
    requestAnimationFrame(()=>stage.classList.add('lit'));
    state='playing';
    const jolt=()=>{stage.classList.add('shake');later(()=>stage.classList.remove('shake'),320)};
    // 1. the bell; he doesn't react right away
    later(()=>{ if(ac)playChime(); chimeText('ピンポーン'); },3500);
    later(()=>cutTo('c1'),4700);
    later(()=>{show('c2');jolt()},6300);
    // 2. looks toward the entrance
    later(()=>cutTo('turn'),7600);
    later(()=>cutTo('c3'),9000);
    later(()=>show('c4'),10000);
    // 3. nobody else is home
    later(()=>cutTo('kitchen'),11300);
    later(()=>cutTo('backroom'),13000);
    // 4. it rings again; he sighs and goes
    later(()=>{ if(ac)playChime(); chimeText('ピンポーン'); },14400);
    later(()=>cutTo('c5'),15100);
    later(()=>show('c6'),16000);
    later(()=>{show('c7');sigh()},16900);
    later(()=>show('c8'),17900);
    // 5. to the entrance
    later(()=>cutTo('living'),18900);
    later(()=>footsteps(4,0.45,0.5),19200);
    later(()=>cutTo('w1'),20700);
    [['w2',21500],['w3',21900],['w4',22300],['w5',22900]].forEach(([id,ms])=>later(()=>show(id),ms));
    later(()=>footsteps(5,0.42,0.6),21500);
    // nothing behind the glass...
    later(()=>{cutTo('genkan');silence(3)},24600);
    // ...then someone is standing there
    later(()=>cutTo('back'),27200);
    later(()=>{document.getElementById('shade').classList.add('on');revealSfx()},27800);
    later(()=>{knock();chimeText('コン　コン　コン')},32300);
    later(()=>goDrop(),34200);
  }

  function blip(vo){

    const o=ac.createOscillator(); o.type=vo.wave||'triangle'; o.frequency.setValueAtTime(f,t);

  }

    later(()=>{ sayEl.textContent='しばらくして――'; }, 4200);

  }

  // ---- the chase (last visitor) ----
  const CHASE_MS=9000;
  function startChase(){
    stopBgm(0.8);
    G.chaseT=performance.now(); G.alpha=1; G.state='ask'; setButtons(true);
    say('「'+G.v.intro+'」',G.v.voice);
    pound(); G.poundIv=setInterval(()=>pound(),1100);
    G.chaseTimer=setTimeout(()=>{ if(G.state==='ask'){G.state='done';setButtons(false);G.results.push({v:G.v,ok:false});stopChase();badEnd()} },CHASE_MS);
  }
  function stopChase(){ clearInterval(G&&G.poundIv); clearTimeout(G&&G.chaseTimer); }

  // ---- frame loop ----
  function loop(){
    raf=requestAnimationFrame(loop);

    else if(titleOn)drawTitle();

  function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}
  function drawGame(){
    const v=G.v, now=performance.now(), t=now/1000;
    if(!v){renderGlass(gctx,[],null,0);return}
    if(G.leaving)G.alpha=Math.max(0,G.alpha-0.012);
    else if(G.alpha<1)G.alpha=Math.min(1,G.alpha+0.012);
    const f=Object.assign({},BASE,v.fig);
    const amp=v.enemy?0:v.sway;
    const fid=(now-G.fidgetT<2200)?1:0;
    f.dx=Math.sin(t*1.1)*amp*1.2+Math.sin(t*2.9)*amp*0.4+fid*(Math.sin(t*5)*2.2+3);
    f.dy=Math.sin(t*1.7)*amp*0.7;
    // leaning in toward the glass
    let p=0;
    if(G.approachT){const e=(now-G.approachT)/1000;
      p=G.approachHold?ease(e/0.7):(e<0.6?ease(e/0.6):e<3.2?1:1-ease((e-3.2)/0.6));}
    f.hs=1+0.75*p; f.drop=p*16; f.sharp=(f.sharp||0.2)+0.22*p;
    const figs=[];
    if(v.mom&&G.chaseT){
      const q=Math.min(1,(now-G.chaseT)/CHASE_MS);
      el('timer').firstElementChild.style.width=((1-q)*100)+'%';
      f.dx+=(Math.random()-0.5)*3.2; f.dy+=(Math.random()-0.5)*1.5;
      figs.push({cx:112-q*48,top:40,hr:10,hry:12,sw:30,sharp:0.12,sc:0.55+q*0.65,alpha:(0.2+q*0.45)*G.alpha,kind:'perm'});
    }
    f.alpha=0.9*G.alpha; figs.push(f);
    let hand=null;
    if(G.hand){const e=(now-G.hand.t)/1000;
      const a=G.hand.hold?Math.min(1,e*3):(e<0.3?e/0.3:e<2.6?1:Math.max(0,1-(e-2.6)/0.5));
      hand={x:f.cx+f.dx+16,y:112,n:G.hand.n,alpha:a*0.95*G.alpha};}
    const fogs=[];
    if(G.approachT&&!v.enemy&&p>0.6){
      const e=(now-G.approachT)/1000;
      // a breath every ~1.2s while the face is close
      [0.75,1.95,3.0].forEach(b=>{
        const d=e-b; if(d<0)return;
        const a=d<0.18?d/0.18:Math.max(0,1-(d-0.18)/1.0);
        if(a>0)fogs.push({x:f.cx+f.dx+(f.lean||0),y:f.top+f.drop+f.hry*f.hs*1.75,r:14,a:a});
        if(!G['br'+b]){G['br'+b]=1;breath();}
      });
    }
    renderGlass(gctx,figs,hand,G.dusk,fogs);
  }

  // ---- "それ" revealed: body upright, but the mouth sits on top of the head and the eyes below ----
  const MW=120, MH=160;
  const MPAL=[[11,9,7],[27,22,38],[42,34,56],[58,42,36],[216,207,196],[169,157,151],[111,100,112],
              [14,10,16],[58,15,20],[26,6,8],[239,230,212],[198,185,162],[242,237,228],[18,12,16],[96,30,34]];
  function snapPal(ctx){
    const im=ctx.getImageData(0,0,MW,MH), d=im.data;
    for(let i=0;i<d.length;i+=4){
      let best=0,bd=1e9;
      for(let k=0;k<MPAL.length;k++){const p=MPAL[k];const dd=(d[i]-p[0])**2+(d[i+1]-p[1])**2+(d[i+2]-p[2])**2;if(dd<bd){bd=dd;best=k}}
      const p=MPAL[best]; d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=255;
    }
    ctx.putImageData(im,0,0);
  }
  const C={night:'#1b1626',night2:'#2a2238',frame:'#3a2a24',skin:'#d8cfc4',skin2:'#a99d97',skin3:'#6f6470',
           line:'#0e0a10',maw:'#3a0f14',maw2:'#1a0608',gum:'#60201f',tooth:'#efe6d4',tooth2:'#c6b9a2',white:'#f2ede4',pupil:'#120c10'};
  function eye(ctx,x,y,r){
    ctx.fillStyle=C.white; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.line; ctx.lineWidth=Math.max(1,r*0.18); ctx.stroke();
    ctx.lineWidth=Math.max(1,r*0.14);
    ctx.beginPath(); ctx.arc(x+r*0.08,y,r*0.52,0.4,Math.PI*1.9); ctx.stroke();       // the spiral
    ctx.fillStyle=C.pupil; ctx.beginPath(); ctx.arc(x+r*0.1,y,r*0.24,0,Math.PI*2); ctx.fill();
  }
  function tooth(ctx,x,y,w,h,down){
    ctx.fillStyle=C.tooth; ctx.strokeStyle=C.line; ctx.lineWidth=1;
    ctx.beginPath();
    if(down){ctx.moveTo(x-w/2,y);ctx.lineTo(x-w/2,y+h-w/2);ctx.arc(x,y+h-w/2,w/2,Math.PI,0,true);ctx.lineTo(x+w/2,y);}
    else{ctx.moveTo(x-w/2,y);ctx.lineTo(x-w/2,y-h+w/2);ctx.arc(x,y-h+w/2,w/2,Math.PI,0,false);ctx.lineTo(x+w/2,y);}
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.tooth2; ctx.fillRect(x+w*0.12,down?y:y-h*0.9,w*0.3,h*0.9);
  }
  function doorway(ctx){
    ctx.fillStyle=C.night; ctx.fillRect(0,0,MW,MH);
    const g=ctx.createRadialGradient(60,8,2,60,8,70); g.addColorStop(0,C.night2); g.addColorStop(1,C.night);
    ctx.fillStyle=g; ctx.fillRect(0,0,MW,MH);
    ctx.fillStyle=C.frame; ctx.fillRect(0,0,9,MH); ctx.fillRect(MW-9,0,9,MH); ctx.fillRect(0,0,MW,6);
  }
  function body(ctx,cx,top,hw){
    ctx.fillStyle=C.skin2; ctx.strokeStyle=C.line; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(cx-hw*0.4,top);
    ctx.quadraticCurveTo(cx-hw,top,cx-hw,top+hw*0.5); ctx.lineTo(cx-hw*1.05,MH+2); ctx.lineTo(cx+hw*1.05,MH+2);
    ctx.lineTo(cx+hw,top+hw*0.5); ctx.quadraticCurveTo(cx+hw,top,cx+hw*0.4,top); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.skin3; ctx.fillRect(cx+hw*0.55,top+hw*0.5,hw*0.4,MH);
  }
  function head(ctx,cx,cy,r){
    ctx.fillStyle=C.skin; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C.skin2; ctx.beginPath(); ctx.arc(cx,cy,r,-0.2,Math.PI*0.75); ctx.arc(cx-r*0.12,cy-r*0.1,r*0.92,Math.PI*0.75,-0.2,true); ctx.fill();
    ctx.strokeStyle=C.line; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  }
  function drawMonster(ctx, stage, q){
    ctx.setTransform(1,0,0,1,0,0); ctx.imageSmoothingEnabled=false;
    if(stage===0){ // standing in the open doorway; a small closed mouth on top, eyes below
      doorway(ctx); body(ctx,60,96,34); head(ctx,60,70,27);
      ctx.strokeStyle=C.line; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(60,61,8,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
      eye(ctx,49,80,5.5); eye(ctx,71,80,5.5);
    }else if(stage===1){ // closer; the mouth on top splits open
      doorway(ctx); body(ctx,60,100,52); head(ctx,60,66,44);
      ctx.fillStyle=C.maw2; ctx.strokeStyle=C.line; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(30,62); ctx.quadraticCurveTo(30,30,60,28); ctx.quadraticCurveTo(90,30,90,62);
      ctx.quadraticCurveTo(60,56,30,62); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle=C.maw; ctx.beginPath(); ctx.ellipse(60,50,18,9,0,0,Math.PI*2); ctx.fill();
      for(let i=0;i<8;i++){const a=Math.PI*(1.12+0.76*i/7); tooth(ctx,60+Math.cos(a)*27,58+Math.sin(a)*27,5,7,true);}
      for(let i=0;i<7;i++){tooth(ctx,36+i*8,61-Math.sin(i/6*Math.PI)*2,5,6,false);}
      eye(ctx,45,88,9); eye(ctx,75,88,9);
    }else if(stage===2){ // lunging: the open mouth is all you can see
      ctx.fillStyle=C.skin; ctx.fillRect(0,0,MW,MH);
      ctx.fillStyle=C.maw2; ctx.beginPath(); ctx.ellipse(60,64,72,46,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=C.maw; ctx.beginPath(); ctx.ellipse(60,70,40,22,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=C.gum; ctx.fillRect(0,14,MW,6);
      for(let i=0;i<7;i++)tooth(ctx,8+i*17,18,14,22,true);
      ctx.fillStyle=C.skin2; ctx.beginPath(); ctx.arc(-4,170,40,0,Math.PI*2); ctx.arc(124,170,40,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=C.line; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(-4,170,40,0,Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.arc(124,170,40,0,Math.PI*2); ctx.stroke();
      for(let i=0;i<5;i++)tooth(ctx,30+i*15,112,12,16,false);
    }else{ // the jaws close
      ctx.fillStyle=C.maw2; ctx.fillRect(0,0,MW,MH);
      const off=q*62;
      ctx.fillStyle=C.gum; ctx.fillRect(0,0,MW,8+off); ctx.fillRect(0,MH-8-off,MW,8+off);
      for(let i=0;i<6;i++)tooth(ctx,10+i*20,8+off,18,30,true);
      for(let i=0;i<6;i++)tooth(ctx,20+i*20-10,MH-8-off,18,30,false);
    }
    snapPal(ctx);
  }
  // ---- endings ----

  // ---- sounds for this part ----
  function ensureAudio(){
    if(ac)return;
    try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=0.8;master.connect(ac.destination);}catch(e){ac=null}
  }
  function tap(v){ if(!ac)return; const t=ac.currentTime+0.02;
    const s=ac.createBufferSource(); s.buffer=makeNoise(0.1);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=4;
    const g=ac.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+0.1); }
  function breath(){ if(!ac)return; const t=ac.currentTime+0.02;
    const s=ac.createBufferSource(); s.buffer=makeNoise(0.9);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.7;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.09,t+0.12); g.gain.exponentialRampToValueAtTime(0.001,t+0.75);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+0.9); }
  function doorSlide(){ if(!ac)return; const t=ac.currentTime+0.02;
    const s=ac.createBufferSource(); s.buffer=makeNoise(1.2);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=3;
    bp.frequency.setValueAtTime(500,t); bp.frequency.linearRampToValueAtTime(900,t+0.9);
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.35,t+0.08);
    g.gain.setValueAtTime(0.3,t+0.8); g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    // the rattle of an old wooden frame
    const am=ac.createOscillator(); am.frequency.value=23; const amg=ac.createGain(); amg.gain.value=0.15;
    am.connect(amg); amg.connect(g.gain);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+1.2); am.start(t); am.stop(t+1.2); }
  function pound(){ if(!ac)return; let t=ac.currentTime+0.02;
    for(let i=0;i<2;i++){
      const s=ac.createBufferSource(); s.buffer=makeNoise(0.25);
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
      const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1.4,t+0.004); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);

    } }
  function runFoot(){ if(!ac)return; let t=ac.currentTime+0.05;
    for(let i=0;i<9;i++){ const v=0.2+i*0.08;
      const s=ac.createBufferSource(); s.buffer=makeNoise(0.15);
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
      const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.006); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t+0.15); t+=0.16; } }
  function footAway(){ if(!ac)return; let t=ac.currentTime+0.3;
    for(let i=0;i<6;i++){ const v=0.5*(1-i/6);
      const s=ac.createBufferSource(); s.buffer=makeNoise(0.15);
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600-i*60;
      const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.008); g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
      s.connect(lp); lp.connect(g); g.connect(master); s.start(t); s.stop(t+0.15); t+=0.5; } }
  function boom(screech){ if(!ac)return; const t=ac.currentTime+0.02;
    const o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(28,t+1.4);
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(1,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+2.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+2.3);
    const s=ac.createBufferSource(); s.buffer=makeNoise(2.5);
    const bp=ac.createBiquadFilter(); bp.type=screech?'bandpass':'lowpass'; bp.frequency.setValueAtTime(screech?2400:300,t);
    if(screech){bp.Q.value=6; bp.frequency.exponentialRampToValueAtTime(900,t+1.6);}
    const ng=ac.createGain(); ng.gain.setValueAtTime(0,t); ng.gain.linearRampToValueAtTime(screech?0.5:0.4,t+0.05); ng.gain.exponentialRampToValueAtTime(0.001,t+2);
    s.connect(bp); bp.connect(ng); ng.connect(master); s.start(t); s.stop(t+2.5); }

  // ---- quiet BGM for the waiting at the door ----
  // a low hum, a few slow notes in the miyako-bushi scale, a wind chime now and then,
  // and evening insects that grow as it gets dark
  let bgm=null;
  function startBgm(){
    if(!ac)return; stopBgm(0.01);
    const bus=ac.createGain(); bus.gain.value=0; bus.connect(master);
    bus.gain.linearRampToValueAtTime(1,ac.currentTime+3);
    const echo=ac.createDelay(1.5); echo.delayTime.value=0.47;
    const fb=ac.createGain(); fb.gain.value=0.38;
    const elp=ac.createBiquadFilter(); elp.type='lowpass'; elp.frequency.value=2200;
    echo.connect(elp); elp.connect(fb); fb.connect(echo); elp.connect(bus);
    const nodes=[];
    // hum
    [[73.4,'sine',0.07],[110,'triangle',0.035],[73.9,'sine',0.05]].forEach(([f,ty,g])=>{
      const o=ac.createOscillator(); o.type=ty; o.frequency.value=f;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420;
      const gg=ac.createGain(); gg.gain.value=g;
      const lfo=ac.createOscillator(); lfo.frequency.value=0.05+Math.random()*0.05;
      const lg=ac.createGain(); lg.gain.value=g*0.6; lfo.connect(lg); lg.connect(gg.gain);
      o.connect(lp); lp.connect(gg); gg.connect(bus); o.start(); lfo.start(); nodes.push(o,lfo);
    });
    bgm={bus,echo,nodes,timers:[]};
    const T=(fn,ms)=>bgm&&bgm.timers.push(setTimeout(fn,ms));
    // slow notes: D Eb G A C (miyako-bushi), two octaves
    const scale=[293.7,311.1,392,440,523.3,587.3,622.3,784];
    const note=()=>{
      if(!bgm)return; const t=ac.currentTime+0.05;
      const f=scale[Math.floor(Math.random()*scale.length)];
      [[1,0.06],[2.0,0.018],[3.01,0.007]].forEach(([m,v])=>{
        const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*m;
        const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0005,t+3.2);
        o.connect(g); g.connect(bus); g.connect(echo); o.start(t); o.stop(t+3.3);
      });
      // sometimes a second note answers
      if(Math.random()<0.35)T(note,700+Math.random()*500);
      else T(note,3200+Math.random()*3800);
    };
    T(note,1800);
    // wind chime: glassy, inharmonic
    const chime=()=>{
      if(!bgm)return; const t=ac.currentTime+0.05, f=1900+Math.random()*500;
      const n=1+Math.floor(Math.random()*3);
      for(let k=0;k<n;k++){const tt=t+k*(0.18+Math.random()*0.2);
        [[1,0.03],[2.76,0.012],[5.4,0.006]].forEach(([m,v])=>{
          const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*m*(1+k*0.004);
          const g=ac.createGain(); g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(v,tt+0.004);
          g.gain.exponentialRampToValueAtTime(0.0004,tt+2.4);
          const p=ac.createStereoPanner?ac.createStereoPanner():null;
          o.connect(g); if(p){p.pan.value=0.6;g.connect(p);p.connect(bus)}else g.connect(bus);
          o.start(tt); o.stop(tt+2.5);
        });}
      T(chime,14000+Math.random()*16000);
    };
    T(chime,6000);
    // evening insects: short chirp trains
    const insect=()=>{
      if(!bgm)return; const dark=G&&G.dusk?G.dusk:0.1;
      let t=ac.currentTime+0.05; const f=4200+Math.random()*400, pan=Math.random()*1.6-0.8;
      const n=3+Math.floor(Math.random()*4);
      for(let k=0;k<n;k++){
        const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
        const am=ac.createOscillator(); am.frequency.value=60; const amg=ac.createGain(); amg.gain.value=0.5;
        const g=ac.createGain(); g.gain.value=0; am.connect(amg); amg.connect(g.gain);
        const v=0.012+dark*0.03;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02); g.gain.linearRampToValueAtTime(0,t+0.13);
        const p=ac.createStereoPanner?ac.createStereoPanner():null;
        o.connect(g); if(p){p.pan.value=pan;g.connect(p);p.connect(bus)}else g.connect(bus);
        o.start(t); am.start(t); o.stop(t+0.15); am.stop(t+0.15); t+=0.24;
      }
      T(insect,1500+Math.random()*3500);
    };
    T(insect,2500);
  }
  function stopBgm(sec){
    if(!bgm)return; const b=bgm; bgm=null;
    b.timers.forEach(clearTimeout);
    try{const t=ac.currentTime; b.bus.gain.cancelScheduledValues(t); b.bus.gain.setValueAtTime(b.bus.gain.value,t); b.bus.gain.linearRampToValueAtTime(0,t+sec);
      setTimeout(()=>{b.nodes.forEach(n=>{try{n.stop()}catch(e){}});try{b.bus.disconnect()}catch(e){}},sec*1000+200);}catch(e){}
  }
  // ---- title drop, then the game ----
  function goDrop(){
    el('skip').hidden=true; state='drop';
    silence(1.2);
    const d=el('drop'); d.classList.remove('on'); void d.offsetWidth; d.classList.add('on');
    if(ac)boom(false);
    later(()=>{ startGame(); },3300);
    later(()=>d.classList.remove('on'),3500);
  }

  title.addEventListener('click',()=>{ if(state==='title')start(); });
  title.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&state==='title'){e.preventDefault();start()}});
  el('skip').addEventListener('click',()=>{ clearTimers(); goDrop(); });
  startTitleLoop();
})();
</script>
